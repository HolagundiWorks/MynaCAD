[package]
name = "aad-dbconnect"
description = "Tren's connection to the suite database: asks Kivo for a session, tells Myna's database service about the open project file and pushes each saved revision"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
aad-odp = { path = "../odp" }
serde_json = { workspace = true }
# Loopback HTTP only (127.0.0.1:8743): no TLS.
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
